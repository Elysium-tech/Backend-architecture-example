services:
  backend:
    build: .
    container_name: elysium-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # DATABASE_URL via secrets (NÃO commitar .env com segredos).
      # Opções suportadas pelo Compose:
      #   a) Docker secrets (recomendado em swarm/prod):
      #      secrets: [database_url]
      #      environment: { DATABASE_URL_FILE: /run/secrets/database_url }
      #   b) Variável já exportada no host / CI (remove do env_file):
      #      DATABASE_URL: ${DATABASE_URL}
      #   c) Dev local SQLite: DATABASE_URL: "file:./dev.db"
      # Volume sqlite-data removido: persistência de SQLite via volume
      # mascarava drift de schema e conflitava com `migrate deploy`.
      # Se Silex migrar para Postgres, apontar DATABASE_URL p/ o serviço db.
      LOG_PRETTY: "false"
    restart: unless-stopped

# Nenhum volume nomeado. SQLite local não é persistido em prod;
# usar banco gerenciado (responsabilidade do Silex via schema.prisma).
